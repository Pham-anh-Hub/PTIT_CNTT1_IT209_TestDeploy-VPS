spring.application.name=demo-deploy-vps

# Cấu hình kết nối MySQL:
# - Mặc định trỏ về localhost (để chạy trực tiếp trên IDE không bị UnknownHostException)
# - Sẽ tự động nhận giá trị SPRING_DATASOURCE_URL khi chạy trong Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/demo-deploy-vps_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate (cho phép tự động tạo bảng nếu cần)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8089}