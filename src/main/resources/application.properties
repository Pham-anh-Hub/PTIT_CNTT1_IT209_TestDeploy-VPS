spring.application.name=demo-deploy-vps

# Cấu hình kết nối MySQL trong Docker mạng nội bộ
spring.datasource.url=jdbc:mysql://mysql-db:3306/demo-deploy-vps_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate (cho phép tự động tạo bảng nếu cần)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8089